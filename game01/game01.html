<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل الدروس التفاعلي</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            position: relative;
            transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .video-wrapper iframe, .video-wrapper #player {
            width: 100%;
            height: 100%;
            max-height: 100%;
            border: 0;
        }

        .player-container.landscape-mode {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            z-index: 99999;
        }

        .controls-bar {
            width: 100%;
            height: 60px;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-top: 1px solid #222;
            z-index: 10;
        }

        .buttons-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background-color: #2b2b2b;
            color: #ffffff;
            border: 1px solid #444;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .square-btn {
            border-radius: 6px !important;
            font-size: 11px;
        }

        .icon-btn:hover {
            background-color: #007bff;
            border-color: #007bff;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn.active {
            background-color: #007bff;
        }

        .icon-btn:disabled {
            background-color: #1a1a1a;
            border-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }

        .status-info {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
        }
    </style>

    <script src="lesson.js"></script>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <div class="video-wrapper">
            <div id="player"></div>
        </div>

        <div class="controls-bar">
            <div class="status-info" id="statusInfo">جاري التحميل...</div>

            <div class="buttons-group">
                <button class="icon-btn" id="rotateBtn" onclick="toggleLandscape()" title="عرض أفقي">⛶</button>
                <button class="icon-btn" id="nextBtn" onclick="goToNextSegment()" title="المقطع التالي">▶</button>
                <button class="icon-btn" id="repeatBtn" onclick="repeatCurrentSegment()" title="إعادة المقطع الحالي">🔄</button>
                <button class="icon-btn square-btn" id="playBtn" onclick="togglePlayPause()" title="إيقاف / تشغيل">⏹</button>
                <button class="icon-btn" id="prevBtn" onclick="goToPreviousSegment()" title="المقطع السابق">◀</button>
            </div>
        </div>
    </div>

    <script>
        let player;
        let checkTimer = null;
        let currentIndex = 0;
        let segments = [];

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            segments = lessonData.segments || [];
            const videoId = extractVideoId(lessonData.youtubeUrl);

            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,
                    'controls': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('statusInfo').innerText = "جاهز";
            // القفز تلقائياً لبداية أول مقطع عند التحميل
            if(segments.length > 0) {
                player.seekTo(segments[0][0], true);
            }
            updateButtonsState();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                document.getElementById('playBtn').innerText = "⏹";
                startMonitoring();
            } else {
                document.getElementById('playBtn').innerText = "▶";
                stopMonitoring();
            }
        }

        // فحص التوقيت ومراقبة نهاية المقطع الحالي
        function startMonitoring() {
            stopMonitoring();
            checkTimer = setInterval(() => {
                if (!player || !player.getCurrentTime) return;

                const currentTime = player.getCurrentTime();
                const [start, end] = segments[currentIndex];

                // إذا تجاوز الوقت نهاية المقطع الحالي يتوقف تلقائياً
                if (currentTime >= end) {
                    player.pauseVideo();
                    player.seekTo(end, true);
                    document.getElementById('statusInfo').innerText = `توقف عند نهاية المقطع: ${formatTime(end)}`;
                }
            }, 200);
        }

        function stopMonitoring() {
            if (checkTimer) clearInterval(checkTimer);
        }

        // تكرار المقطع الحالي فقط (من نقطة بدايته المحددة)
        function repeatCurrentSegment() {
            if (!player || segments.length === 0) return;
            const [start, end] = segments[currentIndex];
            player.seekTo(start, true);
            player.playVideo();
            document.getElementById('statusInfo').innerText = `إعادة المقطع الحالي: ${formatTime(start)} - ${formatTime(end)}`;
        }

        // الانتقال للمقطع التالي (والقفز لبدايته مباشرة)
        function goToNextSegment() {
            if (!player || segments.length === 0) return;
            if (currentIndex < segments.length - 1) {
                currentIndex++;
                const [start, end] = segments[currentIndex];
                player.seekTo(start, true);
                player.playVideo();
                document.getElementById('statusInfo').innerText = `المقطع (${currentIndex + 1}/${segments.length}): ${formatTime(start)} - ${formatTime(end)}`;
                updateButtonsState();
            }
        }

        // الانتقال للمقطع السابق (والقفز لبدايته مباشرة)
        function goToPreviousSegment() {
            if (!player || segments.length === 0) return;
            if (currentIndex > 0) {
                currentIndex--;
            }
            const [start, end] = segments[currentIndex];
            player.seekTo(start, true);
            player.playVideo();
            document.getElementById('statusInfo').innerText = `المقطع (${currentIndex + 1}/${segments.length}): ${formatTime(start)} - ${formatTime(end)}`;
            updateButtonsState();
        }

        function togglePlayPause() {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function toggleLandscape() {
            const container = document.getElementById('playerContainer');
            const btn = document.getElementById('rotateBtn');
            
            container.classList.toggle('landscape-mode');
            btn.classList.toggle('active');

            if (document.documentElement.requestFullscreen) {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }).catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            }
        }

        function updateButtonsState() {
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex >= segments.length - 1);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
  </html>
